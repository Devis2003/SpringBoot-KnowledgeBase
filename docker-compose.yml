services:
  postgres:
    image: postgres:17
    container_name: knowledgebase-postgres
    environment:
      POSTGRES_DB: knowledgebase
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: knowledge_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: knowledgebase-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: