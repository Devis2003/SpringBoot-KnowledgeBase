name: Deploy Spring Boot to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sqs-events

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SpringBoot-KnowledgeBase
            git pull origin feat/sqs-events
            ./mvnw clean package -DskipTests

            PID=$(pgrep -f "knowledgebase-0.0.1-SNAPSHOT.jar" || true)
            if [ -n "$PID" ]; then
              kill $PID
              sleep 5
            fi

            nohup java -jar target/knowledgebase-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > ~/app.log 2>&1 < /dev/null &

            sleep 10
            curl -f http://localhost:8080/actuator/health