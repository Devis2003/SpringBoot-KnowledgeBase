name: Deploy to EC2

on:
  push:
    branches:
      - feat/github-actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: ./mvnw clean package -DskipTests

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SpringBoot-KnowledgeBase
            git pull origin feat/sqs-events
            ./mvnw clean package -DskipTests
            pkill -f knowledgebase || true
            nohup java -jar target/knowledgebase-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > ~/app.log 2>&1 &