spring:
  application:
    name: knowledgebase

  datasource:
    url: jdbc:postgresql://localhost:5432/knowledgebase
    username: knowledge_user
    password: knowledge_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379



management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

aws:
  s3:
    bucket-name: knowledgebase-dev-bucket-224300919244-ap-south-1-an
    region: ap-south-1
    presigned-url-expiration-minutes: 10

  sqs:
    queue-url: https://sqs.ap-south-1.amazonaws.com/224300919244/knowledgebase-article-events
    region: ap-south-1